# Copied from the car's f1tenth_system/f1tenth_stack/config/vesc.yaml; changes
# from it are marked "race_stack:".
/**:
  # general parameters shared by all vesc-related nodes (and imu_odom)
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # race_stack: was 3000, which made odometry read 1.39x the real distance (and
    # the car drive 0.72x the commanded speed). Measured from a recorded drive two
    # independent ways (scan-to-scan ICP 0.718, lidar-only cartographer 0.717,
    # same forward/reverse/slow/fast): 3000 / 0.7175 = 4180. Check with calibrate.py.
    speed_to_erpm_gain: 4180.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    # race_stack: was -0.58, which turned this car RIGHT for a positive (ROS: left)
    # steering angle; manual driving had A and D swapped. The lidar is not mirrored
    # (an object on the car's left shows at +90 deg), so every controller here
    # (warporacer, disparity_extender, the deadman page) uses + = left.
    # Was 0.58 / 0.45: measured on 2 manual laps (Nov 22, 35 m, R2 0.96, from
    # atan(wheelbase * gyro yaw rate / speed)), that steered 0.704 x the commanded
    # angle - 0.055 rad (straight commands turned 3 deg right). So the wheels turn
    # 1.214 rad per servo unit around 0.495: gain 1 / 1.214, offset 0.495. Full
    # lock (0.4189 rad, as in warporacer's sim) is servo 0.150-0.840.
    steering_angle_to_servo_gain: 0.824
    steering_angle_to_servo_offset: 0.495

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

# race_stack: dropped upstream's vesc_to_odom_node block (race_bringup's
# imu_odom replaces that node and reads the speed_to_erpm_* values above) and
# its throttle_interpolator block (that node was never launched).
