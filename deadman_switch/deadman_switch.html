<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>F1Tenth Deadman</title>
<style>
  html, body { margin: 0; height: 100%; }
  #button {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #555555;
    color: white;
    font: bold 12vmin Helvetica, Arial, sans-serif;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #hint { font-size: 3vmin; font-weight: normal; opacity: 0.8; margin-top: 2vmin; }
</style>
</head>
<body>
<div id="button"><div id="state">DISCONNECTED</div><div id="hint"></div></div>
<script>
// Hold to arm the car. Served by the deadman_switch node on the car at
// http://<car ip>:5005; if opened as a local file, pass ?host=<car ip>:5005.
const HEARTBEAT_MS = 50;
const ACK_TIMEOUT_MS = 500;
const RED = "#b00020", GREEN = "#1b8a3a", GRAY = "#555555";

const params = new URLSearchParams(location.search);
const host = params.get("host")
  || (location.protocol.startsWith("http") ? location.host : "100.111.6.29:5005");
const button = document.getElementById("button");
const stateEl = document.getElementById("state");
document.getElementById("hint").textContent = `hold mouse, finger, or space bar · ${host}`;

let ws = null, held = false, carArmed = false, lastAck = 0;

function connect() {
  ws = new WebSocket(`ws://${host}/`);
  ws.onmessage = (e) => { lastAck = performance.now(); carArmed = e.data === "1"; };
  ws.onclose = () => setTimeout(connect, 500);
}

function send() {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(held ? "1" : "0");
}

function setHeld(h) {
  if (held === h) return;
  held = h;
  send();  // don't wait for the next heartbeat on press/release
}

function tick() {
  // heartbeat: "1" if held, "0" otherwise (still pings so we know we're connected)
  send();
  const connected = performance.now() - lastAck < ACK_TIMEOUT_MS;
  const [text, color] = !connected ? ["DISCONNECTED", GRAY]
    : carArmed ? ["ARMED", GREEN] : ["NOT ARMED", RED];
  stateEl.textContent = text;
  button.style.background = color;
}

button.addEventListener("pointerdown", (e) => { if (e.button === 0) setHeld(true); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) {
  button.addEventListener(ev, () => setHeld(false));
}
button.addEventListener("contextmenu", (e) => e.preventDefault());
addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); setHeld(true); } });
addEventListener("keyup", (e) => { if (e.code === "Space") setHeld(false); });
addEventListener("blur", () => setHeld(false));
document.addEventListener("visibilitychange", () => { if (document.hidden) setHeld(false); });

connect();
setInterval(tick, HEARTBEAT_MS);
</script>
</body>
</html>
