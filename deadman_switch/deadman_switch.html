<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>F1Tenth Deadman</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: #111111;
    color: white;
    font-family: Helvetica, Arial, sans-serif;
  }
  #bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    padding: 8px 16px;
    font-size: 16px;
  }
  #bar button {
    font: inherit;
    font-weight: bold;
    padding: 8px 18px;
    border: 2px solid #888888;
    border-radius: 6px;
    background: #333333;
    color: white;
    cursor: pointer;
  }
  #bar button.on { background: white; color: black; border-color: white; }
  #speedbox { display: flex; align-items: center; gap: 8px; }
  #pad {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #555555;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  /* MANUAL: calm dark pad; a thin green edge fades in while driving */
  #pad.manual { background: #1c1c1c; box-shadow: inset 0 0 0 0 #2fa84f; transition: box-shadow 250ms; }
  #pad.manual.armed { box-shadow: inset 0 0 0 6px #2fa84f; }

  #auto-view { display: flex; flex-direction: column; align-items: center; }
  #state { font-weight: bold; font-size: 12vmin; }
  #hint {
    font-size: max(14px, 3vmin);
    opacity: 0.85;
    margin-top: 2vmin;
    padding: 0 16px;
    text-align: center;
  }

  #manual-view { display: flex; flex-direction: column; align-items: center; width: 100%; }
  #status { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; letter-spacing: 0.05em; }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: #777777; transition: background-color 250ms; }
  #status-note { min-height: 20px; margin: 6px 0 22px; font-size: 14px; color: #aaaaaa; text-align: center; }
  .row { display: flex; justify-content: center; }
  .key {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    margin: 4px;
    border: 2px solid #4a4a4a;
    border-radius: 10px;
    background: #262626;
    color: #cfcfcf;
    font-size: 22px;
    font-weight: bold;
    transition: background-color 80ms, color 80ms, border-color 80ms;
  }
  .key.wide { width: 204px; font-size: 13px; font-weight: normal; }
  .key.down { background: #e9e9e9; border-color: #e9e9e9; color: #111111; }
  #gauges { width: min(420px, 88%); margin-top: 24px; }
  .gauge {
    display: grid;
    grid-template-columns: 48px 1fr 72px;
    gap: 12px;
    align-items: center;
    margin: 12px 0;
    font-size: 14px;
    color: #aaaaaa;
  }
  .gauge .val { text-align: right; font-variant-numeric: tabular-nums; color: #dddddd; }
  .track { position: relative; height: 10px; border-radius: 5px; background: #333333; }
  .fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: #4cc26a; }
  .zero { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; background: #777777; }
  #mhint { margin-top: 18px; font-size: 14px; color: #8a8a8a; text-align: center; padding: 0 16px; }

  .stick {
    display: none;
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #ring { border: 3px solid rgba(255, 255, 255, 0.35); }
  #knob { width: 44px; height: 44px; background: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
<div id="bar">
  <button id="manual">MANUAL</button>
  <button id="auto">AUTO</button>
  <label id="speedbox">top speed
    <input id="maxspeed" type="range" min="0.5" max="3" step="0.25" value="1">
    <span id="maxlabel">1.00 m/s</span>
  </label>
</div>
<div id="pad">
  <div id="auto-view">
    <div id="state">DISCONNECTED</div>
    <div id="hint"></div>
  </div>
  <div id="manual-view">
    <div id="status"><span id="dot"></span><span id="status-text">DISCONNECTED</span></div>
    <div id="status-note"></div>
    <div class="row"><div class="key" data-key="W">W</div></div>
    <div class="row">
      <div class="key" data-key="A">A</div>
      <div class="key" data-key="S">S</div>
      <div class="key" data-key="D">D</div>
    </div>
    <div class="row"><div class="key wide" data-key="Space">space · hold still</div></div>
    <div id="gauges">
      <div class="gauge">speed<div class="track"><div class="fill" id="speed-fill"></div><div class="zero"></div></div><span class="val" id="speed-val"></span></div>
      <div class="gauge">steer<div class="track"><div class="fill" id="steer-fill"></div><div class="zero"></div></div><span class="val" id="steer-val"></span></div>
    </div>
    <div id="mhint">W/S drive · A/D steer · or drag anywhere on the pad · let go to stop</div>
  </div>
  <div id="ring" class="stick"></div>
  <div id="knob" class="stick"></div>
</div>
<script>
// Served by the deadman_switch node on the car at http://<car ip>:5005, which
// only accepts websockets from this served page. The car moves only while the
// pad (or a key) is held; letting go stops it.
//   MANUAL: hold W/A/S/D (or arrows), or drag on the pad (up = forward,
//           sideways = steer). Space alone holds the car still.
//   AUTO:   hold the pad or the space bar to let the controller's /drive through.
const HEARTBEAT_MS = 50;
const ACK_TIMEOUT_MS = 500;
const MAX_STEER = 0.34;  // rad, + = left; the car clamps manual commands too
const REVERSE_FRACTION = 0.5;  // of top speed
const ACCEL = 2.0;  // m/s^2 speeding up; smooth inputs make cleaner maps
const BRAKE = 4.0;  // m/s^2 slowing down
const STEER_IN_KEYS = 0.8;  // rad/s: a tap is a small correction, ~0.4 s to full lock
const STEER_OUT_KEYS = 2.5;  // rad/s back to center
const STEER_DRAG = 3.0;  // rad/s: dragging is already proportional
const RED = "#b00020", GREEN = "#1b8a3a", GRAY = "#555555";
const DRIVE_KEYS = {  // code: [forward, left, on-screen key]
  KeyW: [1, 0, "W"], ArrowUp: [1, 0, "W"], KeyS: [-1, 0, "S"], ArrowDown: [-1, 0, "S"],
  KeyA: [0, 1, "A"], ArrowLeft: [0, 1, "A"], KeyD: [0, -1, "D"], ArrowRight: [0, -1, "D"],
};

const $ = (id) => document.getElementById(id);
const pad = $("pad"), ring = $("ring"), knob = $("knob");
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

let ws = null, carArmed = false, pages = 1, lastAck = 0;
let manual = true, maxSpeed = 1.0;
let pointer = null;  // {id, x0, y0, x, y} in pad pixels while pressed
const keys = new Set();
let speed = 0, steer = 0, lastTick = performance.now();

function connect() {
  ws = new WebSocket(`ws://${location.host}/`);
  ws.onmessage = (e) => {
    // "<armed 0/1> <pages connected>"
    const [armed, n] = e.data.split(" ");
    lastAck = performance.now();
    carArmed = armed === "1";
    pages = Number(n) || 1;
  };
  ws.onclose = () => setTimeout(connect, 500);
}

function driveKeysHeld() {
  return [...keys].some((k) => k in DRIVE_KEYS);
}

function held() {
  return pointer !== null || keys.has("Space") || (manual && driveKeysHeld());
}

function stickRadius() {
  return 0.25 * Math.min(pad.clientWidth, pad.clientHeight);
}

function target() {  // [speed m/s, steer rad] wanted right now in MANUAL
  let fwd = 0, left = 0;
  if (pointer) {
    fwd = (pointer.y0 - pointer.y) / stickRadius();
    left = (pointer.x0 - pointer.x) / stickRadius();
  }
  for (const k of keys) {
    if (k in DRIVE_KEYS) { fwd += DRIVE_KEYS[k][0]; left += DRIVE_KEYS[k][1]; }
  }
  fwd = clamp(fwd, -1, 1);
  left = clamp(left, -1, 1);
  return [fwd * maxSpeed * (fwd < 0 ? REVERSE_FRACTION : 1), left * MAX_STEER];
}

function message() {
  if (!held()) return "0";
  if (!manual) return "1";
  return `1 ${speed.toFixed(2)} ${steer.toFixed(3)}`;
}

function send() {
  // Letting go stops dead: never resume from an old ramp state on the next press.
  if (!held()) speed = steer = 0;
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(message());
}

function tick() {
  const now = performance.now();
  const dt = Math.min((now - lastTick) / 1000, 0.2);
  lastTick = now;
  if (manual && held()) {
    const [wantSpeed, wantSteer] = target();
    const rate = Math.abs(wantSpeed) < Math.abs(speed) ? BRAKE : ACCEL;
    speed += clamp(wantSpeed - speed, -rate * dt, rate * dt);
    const turningIn = Math.abs(wantSteer) > Math.abs(steer) && wantSteer * steer >= 0;
    const steerRate = pointer ? STEER_DRAG : turningIn ? STEER_IN_KEYS : STEER_OUT_KEYS;
    steer += clamp(wantSteer - steer, -steerRate * dt, steerRate * dt);
  } else {
    speed = steer = 0;
  }
  send();  // heartbeat, even when released, so we know we're connected
  render();
}

function setGauge(fill, f) {  // f in [-1, 1], drawn from the center line
  f = clamp(f, -1, 1);
  fill.style.left = `${50 + Math.min(f, 0) * 50}%`;
  fill.style.width = `${Math.abs(f) * 50}%`;
}

function renderManual(connected) {
  const driving = connected && carArmed;
  pad.classList.toggle("armed", driving);
  $("dot").style.background = !connected ? "#777777" : driving ? "#2fa84f" : "#d9a400";
  $("status-text").textContent = !connected ? "DISCONNECTED" : driving ? "DRIVING" : "READY";
  $("status-note").textContent = !connected ? `connecting to ${location.host}…`
    : pages > 1 ? `${pages} pages open: every one must be held` : "";
  const down = new Set([...keys].map((k) => (k === "Space" ? "Space" : DRIVE_KEYS[k]?.[2])));
  for (const el of document.querySelectorAll(".key")) {
    el.classList.toggle("down", down.has(el.dataset.key));
  }
  setGauge($("speed-fill"), speed / maxSpeed);
  setGauge($("steer-fill"), -steer / MAX_STEER);  // left steer fills to the left
  $("speed-val").textContent = `${speed.toFixed(2)} m/s`;
  $("steer-val").textContent = steer === 0 ? "center"
    : `${Math.abs(steer).toFixed(2)} ${steer > 0 ? "L" : "R"}`;

  const showStick = pointer !== null;
  ring.style.display = knob.style.display = showStick ? "block" : "none";
  if (showStick) {
    const r = stickRadius();
    ring.style.width = ring.style.height = `${2 * r}px`;
    ring.style.left = `${pointer.x0}px`;
    ring.style.top = `${pointer.y0}px`;
    knob.style.left = `${pointer.x0 + clamp(pointer.x - pointer.x0, -r, r)}px`;
    knob.style.top = `${pointer.y0 + clamp(pointer.y - pointer.y0, -r, r)}px`;
  }
}

function renderAuto(connected) {
  const [text, color] = !connected ? ["DISCONNECTED", GRAY]
    : carArmed ? ["ARMED", GREEN] : ["NOT ARMED", RED];
  $("state").textContent = text;
  pad.style.background = color;
  $("hint").textContent = !connected ? `connecting to ${location.host}…`
    : pages > 1 ? `${pages} pages open: every one must be held`
    : "hold the pad or space bar to let the controller drive";
}

function render() {
  const connected = performance.now() - lastAck < ACK_TIMEOUT_MS;
  if (manual) renderManual(connected); else renderAuto(connected);
}

function padPoint(e) {
  const box = pad.getBoundingClientRect();
  return [e.clientX - box.left, e.clientY - box.top];
}

function releaseAll() {
  pointer = null;
  keys.clear();
  send();
}

function setMode(isManual) {
  manual = isManual;
  releaseAll();
  $("manual").classList.toggle("on", manual);
  $("auto").classList.toggle("on", !manual);
  $("speedbox").style.visibility = manual ? "visible" : "hidden";
  $("manual-view").style.display = manual ? "flex" : "none";
  $("auto-view").style.display = manual ? "none" : "flex";
  pad.classList.toggle("manual", manual);
  pad.classList.remove("armed");
  pad.style.background = "";
  ring.style.display = knob.style.display = "none";
  render();
}

pad.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || pointer) return;
  const [x, y] = padPoint(e);
  pointer = { id: e.pointerId, x0: x, y0: y, x, y };
  pad.setPointerCapture(e.pointerId);  // keep tracking the drag off the pad
  send();
});
pad.addEventListener("pointermove", (e) => {
  if (pointer && e.pointerId === pointer.id) [pointer.x, pointer.y] = padPoint(e);
});
for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) {
  pad.addEventListener(ev, (e) => {
    if (pointer && e.pointerId === pointer.id) { pointer = null; send(); }
  });
}
pad.addEventListener("contextmenu", (e) => e.preventDefault());

addEventListener("keydown", (e) => {
  if (e.code !== "Space" && !(manual && e.code in DRIVE_KEYS)) return;
  e.preventDefault();  // no scrolling, no clicking a focused button
  if (!keys.has(e.code)) { keys.add(e.code); send(); }
});
addEventListener("keyup", (e) => {
  if (keys.delete(e.code)) send();
});
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

$("manual").addEventListener("click", () => setMode(true));
$("auto").addEventListener("click", () => setMode(false));
$("maxspeed").addEventListener("input", (e) => {
  maxSpeed = Number(e.target.value);
  $("maxlabel").textContent = `${maxSpeed.toFixed(2)} m/s`;
});
// Keep keyboard focus off the controls so Space/arrows always drive.
for (const el of document.querySelectorAll("#bar button, #bar input")) {
  el.addEventListener("pointerup", () => setTimeout(() => el.blur(), 0));
}

setMode(true);
connect();
setInterval(tick, HEARTBEAT_MS);
</script>
</body>
</html>
